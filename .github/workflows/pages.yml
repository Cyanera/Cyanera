# نشر الصفحة على GitHub Pages.
# الخدمة مضبوطة على النشر من فرع gh-pages، وهذا السير يزامنه
# مع الفرع الأساسي عند كل دفعة، فتتحدّث الصفحة المنشورة تلقائيًا.
name: نشر الصفحة

on:
  push:
    branches:
      - "main"
      - "claude/arabic-portfolio-page-oos0qq"
  workflow_dispatch:

permissions:
  contents: write

# نشرة واحدة في كل مرة، دون إلغاء النشرة الجارية
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: مزامنة فرع gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force
